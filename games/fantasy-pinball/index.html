<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#090e1c" />
  <title>Fantasy Pinball – Prototyp</title>
  <link rel="stylesheet" href="./style.css" />
  <script type="module" src="./main.js"></script>
</head>
<body>
  <main id="app">
    <canvas id="game" aria-label="Fantasy-Flipper-Spielfeld"></canvas>

    <header id="hud" aria-live="polite">
      <a class="back-link" href="../../index.html" aria-label="Zur Spiele-Übersicht">←</a>
      <p><span class="hud-label">Punkte</span><strong id="score">0</strong></p>
      <p><span class="hud-label">Kugel</span><strong id="ball-count">1/3</strong></p>
    </header>

    <p id="message" role="status"></p>

    <div id="overlay" class="visible">
      <section class="panel">
        <p class="eyebrow">Spielbarer Technik-Prototyp</p>
        <h1 id="overlay-title">Fantasy Pinball</h1>
        <p id="overlay-text">Halte die linke oder rechte Spielfeldhälfte für den jeweiligen Flipper. Beide Daumen funktionieren gleichzeitig.</p>
        <button id="start-button" type="button">Kugel starten</button>
        <p class="controls">Desktop: Pfeiltasten oder A/D · Neustart: R</p>
        <a href="../../index.html">Zur Spiele-Übersicht</a>
      </section>
    </div>
  </main>
</body>
</html>
